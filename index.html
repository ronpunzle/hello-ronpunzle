<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Taking App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        .note-form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            min-height: 100px;
            margin-bottom: 10px;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #5568d3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .share-btn {
            background: #764ba2;
            font-size: 12px;
            padding: 8px 12px;
        }
        .share-btn:hover {
            background: #6a3f95;
        }
        .activity-feed {
            font-size: 13px;
        }
        .activity-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .activity-item:last-child {
            border-bottom: none;
        }
        .activity-email {
            color: #666;
            flex: 1;
        }
        .activity-status {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            margin: 0 10px;
        }
        .status-sent {
            background: #e3f2fd;
            color: #1976d2;
        }
        .status-delivered {
            background: #e8f5e9;
            color: #388e3c;
        }
        .status-opened {
            background: #f3e5f5;
            color: #7b1fa2;
        }
        .status-clicked {
            background: #fff3e0;
            color: #e65100;
        }
        .status-bounced {
            background: #ffebee;
            color: #c62828;
        }
        .activity-time {
            color: #999;
            font-size: 12px;
            white-space: nowrap;
        }
        .activity-empty {
            color: #999;
            font-style: italic;
            padding: 10px 0;
        }
        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .note {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .note-content {
            color: #333;
            line-height: 1.6;
            margin-bottom: 10px;
            word-wrap: break-word;
        }
        .note-date {
            color: #999;
            font-size: 12px;
        }
        .loading {
            color: white;
            text-align: center;
            padding: 20px;
        }
        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .success {
            background: #51cf66;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 My Notes</h1>

        <div id="message"></div>

        <div class="note-form">
            <textarea id="noteContent" placeholder="Write a new note..."></textarea>
            <button id="submitBtn">Post Note</button>
        </div>

        <div id="notesList" class="notes-list">
            <div class="loading">Loading notes...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        let supabaseClient;
        const messageEl = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');

        async function initSupabase() {
            try {
                const response = await fetch('/api/config');
                const config = await response.json();

                supabaseClient = window.supabase.createClient(config.url, config.anonKey);
                await loadNotes();
                submitBtn.addEventListener('click', submitNote);
            } catch (error) {
                showError('Failed to initialize Supabase. Please check your configuration.');
                console.error(error);
            }
        }

        async function loadNotes() {
            try {
                const { data, error } = await supabaseClient
                    .from('notes')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const notesList = document.getElementById('notesList');
                if (data.length === 0) {
                    notesList.innerHTML = '<div class="loading">No notes yet. Create one!</div>';
                    return;
                }

                notesList.innerHTML = data.map(note => `
                    <div class="note">
                        <div class="note-content">${escapeHtml(note.content)}</div>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                            <div class="note-date">${new Date(note.created_at).toLocaleString()}</div>
                            <button class="share-btn" onclick="shareNote('${escapeAttr(note.title)}', '${escapeAttr(note.content)}', '${note.id}')">📧 Share via Email</button>
                        </div>
                        <div id="activity-${note.id}" class="activity-feed" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee;"></div>
                    </div>
                `).join('');

                // Load activity for each note
                data.forEach(note => loadNoteActivity(note.id));
            } catch (error) {
                showError('Failed to load notes');
                console.error(error);
            }
        }

        async function submitNote() {
            const content = document.getElementById('noteContent').value.trim();

            if (!content) {
                showError('Please write something!');
                return;
            }

            submitBtn.disabled = true;

            try {
                // Use first line as title, or first 50 chars
                const title = content.split('\n')[0].substring(0, 100) || 'Untitled';

                const { error } = await supabaseClient
                    .from('notes')
                    .insert([{
                        title,
                        content,
                        user_id: null
                    }]);

                if (error) throw error;

                document.getElementById('noteContent').value = '';
                showSuccess('Note posted!');
                await loadNotes();
            } catch (error) {
                showError('Failed to post note: ' + error.message);
                console.error(error);
            } finally {
                submitBtn.disabled = false;
            }
        }

        function showError(msg) {
            messageEl.innerHTML = `<div class="error">${msg}</div>`;
            setTimeout(() => messageEl.innerHTML = '', 5000);
        }

        function showSuccess(msg) {
            messageEl.innerHTML = `<div class="success">${msg}</div>`;
            setTimeout(() => messageEl.innerHTML = '', 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeAttr(text) {
            return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        async function shareNote(noteTitle, noteContent, noteId) {
            const email = prompt('Enter recipient email address:');

            if (!email) return;

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showError('Please enter a valid email address');
                return;
            }

            try {
                const response = await fetch('/api/share-note', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        recipientEmail: email,
                        noteTitle,
                        noteContent,
                        noteId
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to send email');
                }

                showSuccess(`Email sent to ${email}!`);
                setTimeout(() => loadNoteActivity(noteId), 500);
            } catch (error) {
                showError('Failed to send email: ' + error.message);
                console.error(error);
            }
        }

        async function loadNoteActivity(noteId) {
            try {
                const { data: events, error } = await supabaseClient
                    .from('email_events')
                    .select('*')
                    .eq('note_id', noteId)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const activityEl = document.getElementById(`activity-${noteId}`);
                if (!activityEl) return;

                if (events.length === 0) {
                    activityEl.innerHTML = '<div class="activity-empty">No shares yet</div>';
                    return;
                }

                // Group by recipient and get latest event
                const byRecipient = {};
                events.forEach(event => {
                    if (!byRecipient[event.recipient] || new Date(event.created_at) > new Date(byRecipient[event.recipient].created_at)) {
                        byRecipient[event.recipient] = event;
                    }
                });

                activityEl.innerHTML = Object.values(byRecipient)
                    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
                    .map(event => `
                        <div class="activity-item">
                            <div class="activity-email">${escapeHtml(event.recipient)}</div>
                            <span class="activity-status status-${event.event_type}">${capitalizeFirst(event.event_type)}</span>
                            <div class="activity-time">${getRelativeTime(event.created_at)}</div>
                        </div>
                    `).join('');
            } catch (error) {
                console.error('Failed to load activity:', error);
            }
        }

        function capitalizeFirst(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        function getRelativeTime(timestamp) {
            const now = new Date();
            const time = new Date(timestamp);
            const seconds = Math.floor((now - time) / 1000);

            if (seconds < 60) return 'just now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            const days = Math.floor(hours / 24);
            if (days < 7) return `${days}d ago`;
            return time.toLocaleDateString();
        }

        // Initialize on page load
        window.addEventListener('load', initSupabase);
    </script>
</body>
</html>
